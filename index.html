<h1>Charon</h1>
<p>Backup and migration for one house: a personal tool that carries its owner's configuration and data into an encrypted repository in his own Google Drive, and back onto any machine.</p>
<p>It is not a service, and it has one user. Its source is at <a href="https://github.com/strahinjatronik/charon">github.com/strahinjatronik/charon</a>.</p>
